upstream svp_api_gateway {
    server api-gateway:8080;
}

# gRPC upstreams (plaintext / h2c)
upstream svp_video_grpc {
    server video-service:50052;
}

upstream svp_user_grpc {
    server user-service:50051;
}

server {
    # Accept HTTP/1.1 and HTTP/2 (h2/h2c). Note: browsers require TLS for h2,
    # this mainly enables proxying HTTP/2 gRPC clients through nginx to backends.
    listen 80 http2;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://svp_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 200m;
    }

    # Proxy gRPC (plaintext/h2c) to internal services. Clients should call
    # endpoints like `/grpc/video/<FullServiceMethod>` or `/grpc/user/<FullServiceMethod>`.
    # Example: grpcurl -authority localhost -plaintext -proto gen/videopb/video.proto \
    #   -d '{}' localhost:80 grpc.videopb.VideoService/GetVideo
    location /grpc/video/ {
        grpc_pass grpc://svp_video_grpc;
        error_page 502 = /grpc_error;
        client_max_body_size 200m;
    }

    location /grpc/user/ {
        grpc_pass grpc://svp_user_grpc;
        error_page 502 = /grpc_error;
        client_max_body_size 200m;
    }

    location = /grpc_error {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        return 502 'gRPC proxy error';
    }

    location /media/avatars/ {
        alias /data/media/avatars/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /media/ {
        alias /data/media/;
        expires 1h;
        add_header Cache-Control "public";
        sendfile on;
        tcp_nopush on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
        }
    }
}
