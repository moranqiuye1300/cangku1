name: short-video-platform

services:
  mysql:
    image: mysql:8.0
    container_name: svp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: short_video
      MYSQL_USER: svp
      MYSQL_PASSWORD: svp123456
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - svp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-usvp", "-psvp123456"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: svp-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - svp-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: svp-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - svp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: svp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - svp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: svp-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - svp-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: svp-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - svp-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  video-service:
    build:
      context: .
      dockerfile: video-service/Dockerfile
    container_name: svp-video-service
    env_file:
      - .env
    environment:
      VIDEO_GRPC_ADDR: ":50052"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: short_video
      KAFKA_BROKERS: kafka:9092
      KAFKA_TRANSCODE_TOPIC: video.transcode
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: svp_videos
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-svp-internal-dev-key}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SVP_SKIP_DOTENV: "1"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - svp-net
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: svp-user-service
    env_file:
      - .env
    environment:
      USER_GRPC_ADDR: ":50051"
      VIDEO_GRPC_ADDR: video-service:50052
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: svp
      MYSQL_PASSWORD: svp123456
      MYSQL_DATABASE: short_video
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-svp-internal-dev-key}
      SVP_SKIP_DOTENV: "1"
    depends_on:
      mysql:
        condition: service_healthy
      video-service:
        condition: service_started
    networks:
      - svp-net
    restart: unless-stopped

  transcode-worker:
    build:
      context: .
      dockerfile: transcode-worker/Dockerfile
    container_name: svp-transcode-worker
    env_file:
      - .env
    environment:
      VIDEO_GRPC_ADDR: video-service:50052
      KAFKA_BROKERS: kafka:9092
      KAFKA_TRANSCODE_TOPIC: video.transcode
      KAFKA_CONSUMER_GROUP: transcode-worker
      MEDIA_ROOT: /data/media
      MEDIA_PUBLIC_URL: /media
      TRANSCODE_CONCURRENCY: "2"
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-svp-internal-dev-key}
      SVP_SKIP_DOTENV: "1"
    volumes:
      - media_data:/data/media
    depends_on:
      kafka:
        condition: service_healthy
      video-service:
        condition: service_started
    networks:
      - svp-net
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: svp-api-gateway
    env_file:
      - .env
    environment:
      GIN_MODE: ${GIN_MODE:-release}
      HTTP_ADDR: ":8080"
      USER_GRPC_ADDR: user-service:50051
      VIDEO_GRPC_ADDR: video-service:50052
      MEDIA_ROOT: /data/media
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      REDIS_ADDR: redis:6379
      AI_SERVICE_URL: http://ai-service:8090
      OBJECT_STORE: ${OBJECT_STORE:-local}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: svp-media
      CDN_PUBLIC_URL: ${CDN_PUBLIC_URL:-/media}
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-svp-internal-dev-key}
      SVP_SKIP_DOTENV: "1"
    volumes:
      - media_data:/data/media
    depends_on:
      user-service:
        condition: service_started
      video-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - svp-net
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: svp-ai-service
    environment:
      AI_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - svp-net
    restart: unless-stopped

  frontend:
    build: ./web
    container_name: svp-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - media_data:/data/media:ro
    depends_on:
      - api-gateway
    networks:
      - svp-net
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  media_data:
  es_data:
  minio_data:

networks:
  svp-net:
    driver: bridge
